[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cst-temporal-transcendence"
version = "0.1.0"
description = "Exact finite theorem, countermodel, and toy-model assets for temporal substrate transcendence"
requires-python = ">=3.13,<3.14"
dependencies = ["jsonschema==4.26.0", "networkx==3.6.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
