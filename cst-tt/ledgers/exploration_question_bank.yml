  related_guards:
  - AC-024
  relevant_tags:
  - CST:S-T
  - CST:A
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-BRG-007
  category: bridge
  mandatory: true
