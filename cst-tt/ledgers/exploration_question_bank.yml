schema_version: '1.1'
project: CST-EXP
phase: CST-EXP-00
rule: Every candidate must answer all 100 questions before ranking. The first 12 are the exact phase-plan core. Blank omission
  is never allowed.
core_question_ids:
- Q-CORE-001
- Q-CORE-002
- Q-CORE-003
- Q-CORE-004
- Q-CORE-005
- Q-CORE-006
- Q-CORE-007
- Q-CORE-008
- Q-CORE-009
- Q-CORE-010
- Q-CORE-011
- Q-CORE-012
allowed_answer_statuses:
- answered
- underdetermined_with_reason
- not_applicable_with_reason
- blocked_with_reason
answer_record_must_include:
- candidate_id
- question_id
- status
- response
- claim_tags
- assumptions
- source_or_new_status
- nonclaims
questions:
- id: Q-CORE-001
  category: core_plan_questions
  mandatory: true
  core: true
  question: What exactly is transported?
  answer_contract: Provide object_kind, source_type, target_type, carrier_of_object; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-027
  relevant_tags:
  - CST:S-T
  minimum_support: A candidate without a transported object is only a slogan.
- id: Q-CORE-002
  category: core_plan_questions
  mandatory: true
  core: true
  question: On what mathematical carrier does that object live?
  answer_contract: Provide carrier_spec, state_or_history_space, support_scope; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-001
  - AC-002
  - AC-003
  - AC-019
  relevant_tags:
  - CST:S-T
  minimum_support: Prevents untyped cross-carrier equality.
- id: Q-CORE-003
  category: core_plan_questions
  mandatory: true
  core: true
  question: What constitutes a bridge between distinct carriers?
  answer_contract: Provide bridge_signature, domain, codomain, admissibility; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-021
  - AC-024
  - AC-041
  - AC-042
  relevant_tags:
  - CST:S-T
  minimum_support: A bridge must be data, not a success label.
- id: Q-CORE-004
  category: core_plan_questions
  mandatory: true
  core: true
  question: Is the bridge a function, relation, span, simulation, common refinement, or process?
  answer_contract: Provide bridge_kind, why_this_kind, composition_rule; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-018
  - AC-042
  relevant_tags:
  - CST:S-T
  minimum_support: Different bridge kinds support different claims.
- id: Q-CORE-005
  category: core_plan_questions
  mandatory: true
  core: true
  question: What must be preserved exactly, and what may vary?
  answer_contract: Provide hard_invariants, soft_invariants, permitted_variation, equivalence_relation; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-006
  - AC-007
  - AC-008
  - AC-009
  - AC-010
  - AC-027
  - AC-045
  - AC-052
  relevant_tags:
  - CST:S-T
  - CST:S-R
  minimum_support: Separates success conditions from incidental similarity.
- id: Q-CORE-006
  category: core_plan_questions
  mandatory: true
  core: true
  question: Does order or path matter?
  answer_contract: Provide route_set, path_dependence_status, holonomy_or_confluence_test; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-005
  - AC-021
  - AC-022
  relevant_tags:
  - CST:S-T
  - CST:S-L
  minimum_support: A successful route need not be route independent.
- id: Q-CORE-007
  category: core_plan_questions
  mandatory: true
  core: true
  question: What happens under copying, fission, fusion, and deletion?
  answer_contract: Provide duplicate_verdict, fission_verdict, fusion_verdict, deletion_verdict; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-013
  - AC-014
  - AC-015
  - AC-016
  - AC-017
  - AC-030
  - AC-031
  - AC-032
  - AC-040
  - AC-059
  relevant_tags:
  - CST:S-L
  minimum_support: Forces relation-valued and null outcomes into view.
- id: Q-CORE-008
  category: core_plan_questions
  mandatory: true
  core: true
  question: What happens when the bridge is removed?
  answer_contract: Provide removal_intervention, maintenance_horizon, failure_mode; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-024
  - AC-025
  - AC-029
  - AC-044
  - AC-058
  relevant_tags:
  - CST:A
  minimum_support: Separates bridge-supported shadow from autonomy.
- id: Q-CORE-009
  category: core_plan_questions
  mandatory: true
  core: true
  question: Can the criterion be checked without direct access to hidden state?
  answer_contract: Provide observability, indirect_tests, identifiability_limit; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-006
  - AC-028
  - AC-035
  - AC-036
  - AC-037
  - AC-046
  - AC-055
  relevant_tags:
  - CST:R
  minimum_support: Connects structure to possible recognition without conflating them.
- id: Q-CORE-010
  category: core_plan_questions
  mandatory: true
  core: true
  question: Is the criterion compositional across multiple substrate changes?
  answer_contract: Provide composition_domain, associativity, defect_law, global_coherence; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-021
  - AC-022
  - AC-023
  - AC-030
  - AC-049
  relevant_tags:
  - CST:S-T
  - CST:S-L
  minimum_support: Multi-stage migration can fail even if each leg looks valid.
- id: Q-CORE-011
  category: core_plan_questions
  mandatory: true
  core: true
  question: What is the approximate or noisy version?
  answer_contract: Provide metric, defect, threshold, horizon, stability_margin; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-028
  - AC-029
  - AC-049
  - AC-050
  - AC-051
  - AC-052
  relevant_tags:
  - CST:S-T
  - CST:S-R
  - CST:A
  minimum_support: Exact toy criteria may be brittle or nonphysical.
- id: Q-CORE-012
  category: core_plan_questions
  mandatory: true
  core: true
  question: Which conclusion, if any, requires A1, A2, or certificate soundness?
  answer_contract: Provide assumption_ladder, structural_free_column, purchased_conclusions; an explicit underdetermination/not-applicable/blocked
    rationale is allowed.
  failure_if_omitted: candidate fails the phase-plan core question gate
  related_guards:
  - AC-010
  - AC-011
  - AC-012
  - AC-019
  - AC-020
  - AC-033
  - AC-034
  - AC-038
  - AC-047
  - AC-048
  relevant_tags:
  - CST:O
  minimum_support: Prevents ontological premises from hiding in notation.
- id: Q-FRM-001
  category: framing
  mandatory: true
  question: What is the candidate’s one-sentence claim with every motivating metaphor removed?
  answer_contract: State a typed proposition or candidate proposition.
  failure_if_omitted: candidate is not evaluable
  related_guards: []
  relevant_tags:
  - CST:S-T
  - CST:S-R
  - CST:S-L
  - CST:A
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-FRM-002
  category: framing
  mandatory: true
  question: 'Which project question is primary: transport, target realization, lineage, autonomy, recognition, or ontology?'
  answer_contract: Name one primary tag and any separately stated implications.
  failure_if_omitted: claim lanes may be conflated
  related_guards: []
  relevant_tags:
  - CST:S-T
  - CST:S-R
  - CST:S-L
  - CST:A
  - CST:R
  - CST:O
  - CST:M
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-FRM-003
  category: framing
  mandatory: true
  question: What would count as a negative, underdetermined, or no-go outcome for this candidate?
  answer_contract: Give at least one non-positive admissible verdict.
  failure_if_omitted: candidate is advocacy rather than exploration
  related_guards: []
  relevant_tags:
  - CST:M
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-FRM-004
  category: framing
  mandatory: true
  question: Which terms in the candidate are genuinely new rather than extracted from SBT?
  answer_contract: List new primitives and why they are needed.
  failure_if_omitted: source provenance is ambiguous
  related_guards: []
  relevant_tags:
  - CST:M
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-TYP-001
  category: typing
  mandatory: true
  question: What exactly is proposed to be transported?
  answer_contract: Name the object, its fields, and whether it is state-, history-, process-, quotient-, relation-, certificate-,
    or package-valued.
  failure_if_omitted: S-T claim is undefined
  related_guards: []
  relevant_tags:
  - CST:S-T
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-TYP-002
  category: typing
  mandatory: true
  question: On what mathematical carrier does the transported object live at source and target?
  answer_contract: Give source and target types and any realization/encoding maps.
  failure_if_omitted: cross-carrier scope is not typed
  related_guards:
  - AC-001
  - AC-002
  relevant_tags:
  - CST:S-T
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-TYP-003
  category: typing
  mandatory: true
  question: How are source and target carrier tokens individuated?
  answer_contract: 'State the DistinctCarrier predicate and level: token, formal state space, dynamics, support, or medium
    kind.'
  failure_if_omitted: distinctness may be nominal only
  related_guards:
  - AC-001
  - AC-002
  - AC-003
  relevant_tags:
  - CST:S-T
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-TYP-004
  category: typing
  mandatory: true
  question: Is the claim fixed-support, distinct-token/same-medium, or genuinely cross-medium?
  answer_contract: Choose one scope and justify it independently of the result.
  failure_if_omitted: scope inflation risk
  related_guards:
  - AC-001
  - AC-002
  relevant_tags:
  - CST:S-T
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-TYP-005
  category: typing
  mandatory: true
  question: What is the source package’s exact status?
  answer_contract: Choose candidate-only, stipulated full package, simplified-certified, component-only, or another named
    status.
  failure_if_omitted: an integrated source subject may be smuggled
  related_guards:
  - AC-008
  - AC-009
  relevant_tags:
  - CST:S-R
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-TYP-006
  category: typing
  mandatory: true
  question: What is the target package’s exact status or goal?
  answer_contract: Name the structural specification and whether satisfaction is assumed, tested, or concluded.
  failure_if_omitted: S-R claim is ambiguous
  related_guards:
  - AC-009
  - AC-010
  relevant_tags:
  - CST:S-R
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-TYP-007
  category: typing
  mandatory: true
  question: What support carries each package during every stage?
  answer_contract: Specify support sets/resources, overlap, and whether support changes.
  failure_if_omitted: carrier/support may be conflated
  related_guards:
  - AC-043
  relevant_tags:
  - CST:S-T
  - CST:S-R
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-TYP-008
  category: typing
  mandatory: true
  question: Which clocks or order structures index source, bridge, and target histories?
  answer_contract: Give synchronization or translation rules and declare gaps.
  failure_if_omitted: temporal continuation is undefined
  related_guards:
  - AC-004
  - AC-045
  relevant_tags:
  - CST:S-T
  - CST:S-L
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-BRG-001
  category: bridge
  mandatory: true
  question: What constitutes a bridge between the distinct carriers?
  answer_contract: Give the bridge data, source, target, domain, codomain, and admissibility conditions.
  failure_if_omitted: no cross-carrier object exists
  related_guards:
  - AC-001
  relevant_tags:
  - CST:S-T
  - CST:S-L
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-BRG-002
  category: bridge
  mandatory: true
  question: Is the bridge a function, partial map, relation, span, simulation, bisimulation, common refinement, overlap process,
    recovery channel, or another type?
  answer_contract: Choose and define the form; do not use “bridge” generically.
  failure_if_omitted: bridge properties cannot be inferred
  related_guards: []
  relevant_tags:
  - CST:S-T
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-BRG-003
  category: bridge
  mandatory: true
  question: Does the bridge act on states, histories, transition laws, interfaces, package records, or several levels?
  answer_contract: List every level and compatibility square.
  failure_if_omitted: translation may be mistaken for migration
  related_guards:
  - AC-041
  relevant_tags:
  - CST:S-T
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-BRG-004
  category: bridge
  mandatory: true
  question: What makes the bridge admissible rather than merely definable?
  answer_contract: List gates for dynamics, support, interface, resources, provenance, and controls.
  failure_if_omitted: bridge may be smuggled
  related_guards: []
  relevant_tags:
  - CST:S-T
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
- id: Q-BRG-005
  category: bridge
  mandatory: true
  question: What causal or process-level dependence connects source and target, if any?
