  failure_if_omitted: comparison may be mistaken for lineage
  related_guards:
  - AC-017
  - AC-042
  relevant_tags:
  - CST:S-L
  minimum_support: reasoned structural answer or explicit underdetermination/not-applicable rationale
  core: false
